# DDOCraft dev/test site - separate port, plain HTTP, LAN-only testing.
# Not part of codehawkins.com's config; safe to remove independently.
#
# Deployed 2026-07-28 to the codehawkins dev VM (192.168.1.153):
#   sudo tee /etc/nginx/sites-available/ddocraft < infra/ddocraft_dev.nginx.conf
#   sudo ln -sf /etc/nginx/sites-available/ddocraft /etc/nginx/sites-enabled/ddocraft
#   sudo nginx -t && sudo systemctl reload nginx
# Serves the app from /home/claude/ddocraft (a git clone of this repo, kept up to date via
# `git -C /home/claude/ddocraft pull`). The visitor-counter/log files
# (ddocraft_counter.txt/ddocraft_log.txt) needed `chmod 666` so php-fpm's www-data user can write
# to them - they're owned by the claude account, not www-data.
# URL: http://192.168.1.153:8080/ddocraft.php
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /home/claude/ddocraft;
    index ddocraft.php;

    location / {
        try_files $uri $uri/ =404;
    }

    # Proxies the client's same-origin fetch() calls to the Node/Express API server (port 3001,
    #   see server/) - keeps the browser talking to one origin (8080) so no CORS config is needed,
    #   same as how a real single-nginx-in-front-of-both deployment would look.
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_set_header Host $host;
    }

    location ~ \.php$ {
        fastcgi_index   ddocraft.php;
        fastcgi_pass    unix:/run/php/php7.4-fpm.sock;
        include         /etc/nginx/fastcgi_params;
        fastcgi_param   SCRIPT_FILENAME    $request_filename;
        fastcgi_param   PATH_INFO          $fastcgi_path_info;
    }
}
